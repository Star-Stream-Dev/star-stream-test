name: Write .env

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env (repo root)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pwd
          ls -la

          cat > .env << 'EOF'
          VITE_SUPABASE_PROJECT_ID="hbhopyhvtedsiihaqthl"
          VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiaG9weWh2dGVkc2lpaGFxdGhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2NTI1NDQsImV4cCI6MjA4MzIyODU0NH0.MDPazDi6HmEa2Max5faaFcn_WNb-SLEgzmFyTmfWkAQ"
          VITE_SUPABASE_URL="https://hbhopyhvtedsiihaqthl.supabase.co"
          EOF

          echo "Created .env:"
          ls -la .env

      - name: Upload .env artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: ${{ github.workspace }}/.env
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
